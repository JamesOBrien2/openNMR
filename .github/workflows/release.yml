name: Release

on:
  push:
    tags:
      # Version tags without a leading v: 0.1.0, 0.2.0, ...
      - "[0-9]*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple silicon
            platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: Linux x86_64
            platform: ubuntu-22.04
            target: ""
            args: ""
          - name: Windows x86_64
            platform: windows-latest
            target: ""
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system libraries
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev build-essential file wget curl

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target || matrix.platform }}

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: openNMR ${{ github.ref_name }}
          releaseBody: |
            Prebuilt openNMR builds are attached below.

            Windows: the MSI and setup.exe install the app; the portable zip
            runs without installing but needs the WebView2 runtime.

            macOS: the build is unsigned and not notarized. If macOS refuses to
            open it, run:
              xattr -dr com.apple.quarantine /Applications/openNMR.app

            Linux: use the AppImage for a portable build, or the deb/rpm package.

            These builds are not code-signed. On Windows, SmartScreen may show a
            warning. Only download builds from this repository's Releases page.

            See the README for what is included and how to open the synthetic
            example.
          generateReleaseNotes: true
          # Publish as a normal release, not a pre-release.
          prerelease: false
          releaseDraft: false
          retryAttempts: 2
          args: ${{ matrix.args }}

      # Tauri has no portable bundle target on Windows. The raw binary embeds the
      # frontend and runs from any folder; only the WebView2 runtime is needed.
      - name: Package portable Windows build
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          # This repository is a Cargo workspace, so the binary is written to the
          # workspace target directory, which is not necessarily the app folder.
          # Ask cargo instead of guessing.
          $targetDir = (cargo metadata --format-version 1 --no-deps | ConvertFrom-Json).target_directory
          $releaseDir = Join-Path $targetDir "release"
          Write-Host "Workspace target directory: $targetDir"
          Write-Host "Executables in ${releaseDir}:"
          Get-ChildItem $releaseDir -Filter *.exe -ErrorAction SilentlyContinue | Format-Table Name, Length

          $exe = Join-Path $releaseDir "opennmr.exe"
          if (-not (Test-Path $exe)) {
            # Fallback: the only executables directly in release/ are the app
            # binaries, so take the largest one.
            $exe = Get-ChildItem $releaseDir -File -Filter *.exe -ErrorAction SilentlyContinue |
              Sort-Object Length -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $exe) { throw "No executable found in $releaseDir" }
          Write-Host "Packaging $exe"

          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item $exe "portable/openNMR.exe"
          Compress-Archive -Path "portable/openNMR.exe" -DestinationPath "openNMR_${{ github.ref_name }}_x64_portable.zip" -Force
          Write-Host "Created openNMR_${{ github.ref_name }}_x64_portable.zip"

      - name: Upload portable Windows build
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            "openNMR_${{ github.ref_name }}_x64_portable.zip" --clobber
